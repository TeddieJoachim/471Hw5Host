<!DOCTYPE html>
<html>
  <head>
    <title>BOIDS</title>
    <style>
      body {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        background-color: #333;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      canvas {
        background-color: #222;
        border: 1px solid black;
      }

      #controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 220px;
      }

      .parameter {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      input[type="number"] {
        padding: 5px;
        width: 100%;
        box-sizing: border-box;
      }

      button {
        padding: 8px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="controls">
      <h2>Simulation Parameters</h2>

      <div class="parameter">
        <label for="foodFlag">Food Attraction</label>
        <input type="checkbox" id="foodFlag" checked>
      </div>

      <div class="parameter">
        <label for="foodX">Food X Coordinate</label>
        <input type="number" id="foodX" value="0.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="foodY">Food Y Coordinate</label>
        <input type="number" id="foodY" value="0.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="alpha">Alpha</label>
        <input type="number" id="alpha" value="1.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="gamma1">Gamma 1 (Food Attraction)</label>
        <input type="number" id="gamma1" value="1.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="gamma2">Gamma 2 (Leader Following)</label>
        <input type="number" id="gamma2" value="1.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="kappa">Kappa (Flocking)</label>
        <input type="number" id="kappa" value="1.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="rho">Rho (Repulsion)</label>
        <input type="number" id="rho" value="1.0" step="0.1">
      </div>

      <div class="parameter">
        <label for="delta">Delta (Numerical Stability)</label>
        <input type="number" id="delta" value="0.001" step="0.001" min="0">
      </div>

      <div class="parameter">
        <label for="numBirds">Number of Birds</label>
        <input type="number" id="numBirds" value="10" min="10" step="1">
      </div>

      <button id="startButton">Start Simulation</button>
      <button id="stopButton">End Simulation and Free Memory</button>
    </div>

    <script src="../build/boidRunner.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
